<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6cf0"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="53" y="69" width="150" height="118" rx="22"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="badge-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#tile)"/>
  <!-- a thumbnail, centred on the tile: soft shadow straight below, picture, landscape -->
  <rect x="53" y="77" width="150" height="118" rx="22" fill="#1e1b4b" opacity=".35" filter="url(#soft)"/>
  <rect x="53" y="69" width="150" height="118" rx="22" fill="#ffffff"/>
  <g clip-path="url(#frame)">
    <circle cx="97" cy="111" r="14" fill="#fbbf24"/>
    <path d="M53 167 C87 129 113 131 137 153 S181 135 203 145 V187 H53 Z" fill="#a78bfa"/>
  </g>
  <!-- the corner badge as skyggn draws it at its largest size (32 % of the thumbnail): square,
       hanging out past the picture's corner, corners rounded by 30 % of its height, frosted glass with
       a hairline edge and a soft shadow, and the engine's own play symbol at 56 % of its height -->
  <rect x="161" y="148" width="56" height="56" rx="17" fill="#000000" opacity=".3" filter="url(#badge-shadow)"/>
  <rect x="161" y="145" width="56" height="56" rx="17" fill="#1b1830" opacity=".92"/>
  <rect x="161.6" y="145.6" width="54.8" height="54.8" rx="16.4" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.2"/>
  <path transform="translate(173.32 157.32) scale(1.3067)" d="M8.2 4.9 18.6 11.1a1.05 1.05 0 0 1 0 1.8L8.2 19.1A1.05 1.05 0 0 1 6.6 18.2V5.8a1.05 1.05 0 0 1 1.6-.9Z" fill="#ffffff"/>
</svg>
